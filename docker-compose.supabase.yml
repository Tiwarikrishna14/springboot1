services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-approval-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?user=postgres.bunoceaaawmrgpnokwul&password=Admin@123#123
      username: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: Admin@123#123}
      JWT_SECRET: dev-only-change-this-secret-key-at-least-32-bytes
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      INITIAL_ADMIN_EMAIL: superadmin@example.com
      INITIAL_ADMIN_PASSWORD: ChangeMe@12345
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-http://localhost:5173/reset-password}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep UP >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
