services:
  postgres:
    image: postgres:16-alpine
    container_name: order-approval-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-order_approval}
      POSTGRES_USER: ${POSTGRES_USER:-order_approval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-order_approval}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-approval-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-order_approval}
      DB_USERNAME: ${POSTGRES_USER:-order_approval}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-order_approval}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-key-at-least-32-bytes}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-superadmin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-ChangeMe@12345}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-http://localhost:5173/reset-password}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep UP >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
