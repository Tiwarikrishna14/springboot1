spring:
  application:
    name: order-approval-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?user=postgres.bunoceaaawmrgpnokwul&password=Admin@123#123
    username: postgres
    password: Admin@123#123
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Bulk uploads may contain one spreadsheet plus many product images.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:500MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:1GB}

server:
  port: ${SERVER_PORT:8081}
  tomcat:
    max-swallow-size: ${TOMCAT_MAX_SWALLOW_SIZE:1GB}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-key-at-least-32-bytes}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION:604800}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
  product-images:
    upload-dir: ${PRODUCT_IMAGE_UPLOAD_DIR:uploads/products}
    path-prefix: /uploads/products
